<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/legacy/css/styles.css">
  <link rel="stylesheet" href="/legacy/css/register.css">
  <title>Regístrate</title>
</head>

<body>
  <header>
    <nav class="main-navbar">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="proposal.html">Propuesta</a></li>
        <li><a href="about_us.html">Nosotros</a></li>
        <li><a href="admin_dashboard.html">Estadisticas</a></li>
        <li><a href="login.html">Iniciar Sesion</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="register-card">

      <h1 class="register-title">Crea tu cuenta</h1>
      <p class="register-subtitle">Registrate para realizar una reserva.</p>

      <div class="row g-2">
        <div class="col-16">
          <label class="label">Nombre</label>
          <input type="text" placeholder="Nombre">
        </div>
        <div class="col-16">
          <label class="label">Apellidos</label>
          <input type="text" placeholder="Apellidos">
        </div>
      </div>

      <div class="col-16">
        <label class="label">Fecha de nacimiento</label>
        <input type="date" id="startDate">
      </div>

      <div class="col-16">
        <label class="label">Número de teléfono</label>
        <input type="tel" placeholder="Número de teléfono">
      </div>

      <div class="col-16">
        <label class="label">Correo electrónico</label>
        <input type="email" placeholder="Correo electrónico">
      </div>

      <div class="col-16">
        <label class="label">Contraseña</label>
        <input type="password" placeholder="Contraseña">
      </div>
      <a href="login.html" class="btn-submit">Enviar</a>
      <a href="login.html" class="btn-login">Ya tengo una cuenta</a>
    </div>
  </main>
</body>
