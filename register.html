<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/register.css">
  <title>Regístrate</title>
</head>

<body>
  <header>
    <nav class="main-navbar">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="proposal.html">Nuestra propuesta</a></li>
        <li><a href="about_us.html">Sobre nosotros</a></li>
        <li><a href="admin_dashboard.html">Estadisticas</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="register-card">

      <h1 class="register-title">Crea tu cuenta</h1>
      <p class="register-subtitle">Registrate para realizar una reserva.</p>

      <div class="group">
        <label class="label">Nombre</label>
        <div class="row">
          <input type="text" placeholder="Nombre">
          <input type="text" placeholder="Apellidos">
        </div>
      </div>

      <div class="group">
        <label class="label">Fecha de nacimiento</label>
        <div class="date-row">
          <select>
            <option value="">Día</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
          <select>
            <option value="">Mes</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
          <select>
            <option value="">Año</option>
            <option value="1990">1990</option>
            <option value="1985">1985</option>
            <option value="1980">1980</option>
          </select>
        </div>
      </div>

      <div class="group">
        <label class="label">Correo electrónico</label>
        <input type="email" placeholder="Correo electrónico">
      </div>

      <div class="group">
        <label class="label">Contraseña</label>
        <input type="password" placeholder="Contraseña">
      </div>
      <a href="login.html">
      <button class="btn-submit">Enviar</button>
      </a>
      <a href="login.html">
      <button class="btn-login">Ya tengo una cuenta</button>
      </a>
    </div>
  </main>
</body>
