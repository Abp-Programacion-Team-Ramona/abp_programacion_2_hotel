<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/register.css" />
    <title>Registrate</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark px-4">
        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Abrir menú"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="menuPrincipal">
          <ul class="navbar-nav gap-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="proposal.html">Nuestra propuesta</a></li>
            <li class="nav-item"><a class="nav-link" href="about_us.html">Sobre nosotros</a></li>
            <li class="nav-item"><a class="nav-link" href="admin_dashboard.html">Estadísticas</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <section class="register-section">
        <div class="container">
          <div class="card mx-auto p-4 register-card">
            <h1 class="text-center mb-2">Crea una cuenta</h1>

            <p class="text-center text-muted mb-4">
              Registrate para hacer tu reserva.
            </p>

            <form class="row g-4" action="/registro" method="POST">
              <div class="col-md-6">
                <label for="nombre" class="form-label title">Nombre</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  class="form-control"
                  placeholder="Nombre"
                  autocomplete="given-name"
                />
              </div>

              <div class="col-md-6">
                <label for="apellido" class="form-label title">Apellido</label>
                <input
                  type="text"
                  id="apellido"
                  name="apellido"
                  class="form-control"
                  placeholder="Apellido"
                  autocomplete="family-name"
                />
              </div>

              <div class="col-12">
                <label for="fecha_nac" class="form-label title">Fecha de nacimiento</label>
                <input
                  type="date"
                  id="fecha_nac"
                  name="fecha_nac"
                  class="form-control"
                  autocomplete="bday"
                />
              </div>

              <div class="col-12">
                <label for="email" class="form-label title">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control"
                  placeholder="Correo electrónico"
                  autocomplete="email"
                />
              </div>

              <div class="col-12">
                <label for="contrasena" class="form-label title">Contraseña</label>
                <input
                  type="password"
                  id="contrasena"
                  name="contrasena"
                  class="form-control"
                  placeholder="Contraseña"
                  autocomplete="new-password"
                />
              </div>

              <div class="col-12">
                <button class="btn btn-primary w-100" type="submit">
                  Enviar
                </button>
              </div>

              <div class="col-12 text-center">
                <a href="login.html">Ya tengo una cuenta</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
