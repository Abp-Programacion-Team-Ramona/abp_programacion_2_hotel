<header>
    <nav class="main-navbar">
        <ul>
            <li>
                <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                    Inicio
                </a>
            </li>

            <li>
                <a routerLink="/about-us" routerLinkActive="active">
                    Nosotros
                </a>
            </li>

            @if (userService.currentUser(); as usuario) {
            @if (usuario.id_rol === ADMIN_ROLE_ID) {
            <li>
                <a routerLink="/admin-dashboard" routerLinkActive="active">
                    Estadísticas
                </a>
            </li>
            } @else {
            <li>
                <a routerLink="/user-dashboard" routerLinkActive="active">
                    Mi panel
                </a>
            </li>
            }

            <li>
                <button type="button" class="navbar-logout" (click)="cerrarSesion()">
                    Cerrar sesión
                </button>
            </li>
            } @else {
            <li>
                <a routerLink="/register" routerLinkActive="active">
                    Registrarse
                </a>
            </li>

            <li>
                <a routerLink="/login" routerLinkActive="active">
                    Iniciar sesión
                </a>
            </li>
            }
        </ul>
    </nav>
</header>

<router-outlet></router-outlet>

<footer>
    <p>© 2026 Hotel Ramona - Todos los derechos reservados</p>
</footer>
