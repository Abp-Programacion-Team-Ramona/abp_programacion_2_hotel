<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/user_dashboard.css">
    <link rel="stylesheet" href="css/support.css">
    <title>Soporte</title>
</head>

<body>
    <header>
        <nav class="main-navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html">Cerrar Sesion</a></li>
            </ul>
        </nav>
    </header>

    <main class="container py-5">

        <h1 class="mb-2">Bienvenido a Soporte</h1>
        <p class="mb-4">Dejanos tu consulta o reclamo completando el formulario y nos comunicaremos a la brevedad.</p>

        <div class="profile-card">
            <h2 class="profile-card-title">Nueva consulta</h2>


            <div class="profile-group">
                <span class="profile-label">Asunto</span>
                <input type="text" class="support-input" placeholder="Ej: Consulta sobre mi reserva">
            </div>

            <div class="profile-group">
                <span class="profile-label">Tipo</span>
                <div class="support-radio-group">
                    <label class="support-radio">
                        <input type="radio" name="tipo" checked> Consulta
                    </label>
                    <label class="support-radio">
                        <input type="radio" name="tipo"> Reclamo
                    </label>
                </div>
            </div>

            <div class="profile-group">
                <span class="profile-label">Mensaje</span>
                <textarea class="support-input support-textarea" placeholder="Describí tu consulta o reclamo..."></textarea>
            </div>

            <div class="reservation-actions" style="justify-content: flex-start;">
                <button class="btn-res btn-modify">Enviar consulta</button>
            </div>

        </div>

        <div class="outer-actions">
            <a href="user_dashboard.html" class="btn-res btn-back">Volver</a>
        </div>

    </main>

    <footer>
        <p>© 2026 Hotel Ramona - Todos los derechos reservados</p>
    </footer>

</body>
</html>
