<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/reservation_form.css">
    <title>Nueva Reserva</title>
</head>

<body>

    <header>
        <nav class="main-navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="proposal.html">Nuestra propuesta</a></li>
                <li><a href="about_us.html">Sobre nosotros</a></li>
                <li><a href="admin_dashboard.html">Estadisticas</a></li>
                <li><a href="register.html">Registrarse</a></li>
                <li><a href="login.html">Iniciar Sesion</a></li>
            </ul>
        </nav>
    </header>

    <main class="reservation-container">
        <form class="reservation-form">
            <h1>Nueva Reserva</h1>
            <div class="form-section">
                <h3>Detalles de la reserva</h3>

                <label for="startDate">Desde</label>
                <input type="date" id="startDate">

                <label for="endDate">Hasta</label>
                <input type="date" id="endDate">

                <label for="guests">Cantidad de huéspedes</label>
                <input type="number" id="guests" min="1">
            </div>
            <div class="form-section">
                <h3>Tipo de habitación</h3>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="room">
                        Standard
                    </label>
                    <label>
                        <input type="radio" name="room">
                        Suite
                    </label>
                </div>
            </div>
            <div class="form-section">
                <h3>Servicios adicionales</h3>
                <div class="checkbox-group">
                    <label><input type="checkbox"> Menú diario</label>
                    <label><input type="checkbox"> Cochera</label>
                    <label><input type="checkbox"> Cuidado de niños</label>
                    <label><input type="checkbox"> Gimnasio</label>
                    <label><input type="checkbox"> Spa</label>
                </div>
            </div>
            <div class="form-section">
                <h3>Observaciones</h3>
                <textarea placeholder="Ingrese comentarios adicionales"></textarea>
            </div>
            <button type="submit">
                Confirmar reserva
            </button>
        </form>
    </main>

</body>

</html>
