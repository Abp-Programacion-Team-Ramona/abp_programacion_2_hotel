<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Iniciar sesion</title>
</head>

<body>

    <header>
        <nav class="main-navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="proposal.html">Nuestra propuesta</a></li>
                <li><a href="about_us.html">Sobre nosotros</a></li>
                <li><a href="admin_dashboard.html">Estadisticas</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-login">

        <section class="lado-izquierdo">

            <img class="img-login" src="assets/images/hotel.jpg" alt="Hotel Ramona">

            <h2 class="slogan">Tu hogar lejos de casa</h2>

        </section>

        <section class="lado-derecho">

            <h1>Iniciar Sesión</h1>

            <form action="user_dashboard.html">

                <input 
                     type="email"
                     class="form-control"
                     placeholder="Correo electrónico"
                     required>

                <input 
                     type="password"
                     class="form-control"
                     placeholder="Contraseña"
                     required>
                
                  <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                         id="recordarme">
                        <label
                          class="form-check-label"
                         for="recordarme">
                          Recordarme
                        </label>
                    </div>
                <button type="submit" class="btn btn-light w-100">
                    Iniciar
                </button>

                <p class="registro-link">
                 ¿Todavia no te registrate?
                 <a href="register.html">Registrate</a>
                 </p>

            </form>

        </section>

    </main>

</body>

</html>
