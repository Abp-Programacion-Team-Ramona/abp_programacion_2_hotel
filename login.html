<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Iniciar sesion</title>
</head>

<body class="login-page">

    <header>
        <nav class="main-navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="proposal.html">Propuesta</a></li>
                <li><a href="about_us.html">Nosotros</a></li>
                <li><a href="admin_dashboard.html">Estadisticas</a></li>
                <li><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-container">

        <div class="login-card">

            <h1>Iniciar Sesión</h1>

            <form action="user_dashboard.html">

                <input type="email" class="form-control mb-3" placeholder="Correo electrónico">

                <input type="password" class="form-control mb-3" placeholder="Contraseña">

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="recordarme">
                    <label class="form-check-label" for="recordarme">
                        Recordarme
                    </label>
                </div>

                <button type="submit" class="btn btn-light w-100">
                    Iniciar
                </button>

                <p class="registro-link">
                    ¿Todavia no te registrate?
                    <a href="register.html">Registrate</a>
                </p>

            </form>

        </div>

    </main>

</body>

</html>
